name: Bug 反馈
description: 报告 malilib-ui 的缺陷或界面渲染异常。
title: "[Bug] （请填写简要标题）"
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整信息，方便复现与定位问题。
        > [!important]
        > 请确认：已使用最新版本；已确认 MaLiLib 与 Minecraft 版本匹配；已在 Issues 中检索过相同问题。

  - type: input
    id: mc_version
    attributes:
      label: Minecraft 版本
      description: 例如 26.3
    validations:
      required: true

  - type: input
    id: malilib_version
    attributes:
      label: MaLiLib 版本
      description: 例如 0.30.1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望的行为是什么？可以附截图。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 详细描述如何再次触发该问题。
      placeholder: |
        1. 打开任意 masa 模组的配置界面
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 崩溃报告（可选）
      description: 请优先使用 GitHub 附件上传最新日志的完整内容，不要只截取片段。
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认事项
      options:
        - label: 我已确认该问题在关闭其他非必要模组后仍可复现。
          required: false
